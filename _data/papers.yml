# Papers, in the order they appear in each section of the Research page.
# Add a paper by copying a block; nothing else needs editing. The home-page
# card shows the paper marked featured: true.
#
#   id          short name, used in links (research.html#id); letters and -
#   section     publication | working | progress | other
#   title       full title
#   coauthors   list of name, affiliation (optional), url (optional)
#   journal     for publications: journal, year, volume, pages, doi
#   status      short line under the title ("Draft available", ...)
#   date        shown after the status ("October 2026")
#   links       buttons: label, url, kind (pdf, slides, data, code, web);
#               the first one is the main (filled) button
#   abstract    text of the Abstract panel (optional)
#   cite        true: adds the Cite panel (reference + BibTeX)
#   venue       where the paper stands, for the reference ("Working paper, ...")
#   bib         BibTeX details: key, year, month, note, title (optional,
#               to protect capitals with braces)
#   short       short title, used in the list of presentations (optional)
#   talks       id used for this paper in _data/talks.yml (optional)
#   topics      tags used by the topic filter, see topics below
#   featured    true: shown in the card on the home page
#   featured_note  sentence under the title in that card

