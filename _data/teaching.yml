# Teaching materials: single source of truth for the Teaching hub,
# course pages and session pages.
#
# Files are listed automatically: drop them into the session folder,
# e.g. teaching/econometrics/s01/worksheet/, .../data/, .../code/,
# .../readings/, .../slides/. A .zip at the session root is offered as
# the one-click session package (build it with _tools/build_packages.py).
#
# Session fields (all optional except id, number, title):
#   title_local   original French title          question   guiding question
#   created       date the material was written  published  date it went online
#   intro         overview paragraph (French)    objectives list of strings
#   plan          [{time, work}]                 exercises  list of exercise titles
#   exit_label / exit                            closing written task
#   applications  [{role, cite, ref, url, replication}]
#   notes         {file name: one-line description shown under the file}
#   external_data [{name, source, url, note}]   files that are linked, not hosted

