  - id: development-seminar
    url: /teaching/development-seminar/
    title: Development Economics Seminar
    title_local: Séminaire d’Économie du Développement (SED)
    programme: M.Sc. in Development Economics, 2nd year (Economic Analysis track)
    institution: School of Economics — Université Clermont Auvergne
    year: "2025–26"
    role: Doctoral tutor
    language: French
    materials: false
    cta: Format and reading list
    summary: >-
      Year-long research seminar in which pairs of students present a recent
      paper in development economics and two discussants critique it. As one
      of the CERDI doctoral tutors, I prepared the presenting and discussing
      students ahead of their session, working through each paper’s question,
      contribution, data and identification strategy.
    credit: >-
      Course led by Vianney Dequiedt and Èric Roca Fernández (CERDI). The format
      and reading list below are summarised from their 2025–26 syllabus.
    extra_facts:
      - { dt: Format, dd: "15 two-hour sessions over the year · 9 ECTS" }
    format_title: How a session works
    format_intro: >-
      Before each session, the doctoral tutor in charge of the paper holds a
      one-hour meeting with its presenters and discussants, who have already
      studied the paper in depth.
    format:
      - { time: "30 min", work: "A pair of students — the “authors” — present the paper." }
      - { time: "15 min", work: "Two discussants critique it, starting with the points that could overturn its conclusions." }
      - { time: "5–10 min", work: "The authors reply to the discussants." }
      - { time: "Open", work: "General discussion with the whole class." }
