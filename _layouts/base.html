<!DOCTYPE html>
<html lang="{{ page.lang | default: site.lang | default: 'en' }}">
<head>
{% include head.html %}
</head>
<body>

{% include header.html %}

<main id="main">
{{ content }}
</main>

{% include footer.html %}

<script>
  (function () {
    var root = document.documentElement;

    /* Theme toggle: remembers the visitor's choice; otherwise follows the system. */
    var toggle = document.querySelector('.theme-toggle');
    var meta = document.querySelector('meta[name="theme-color"]');
    function stored() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
    function apply(theme) {
      root.setAttribute('data-theme', theme);
      if (meta) meta.setAttribute('content', theme === 'dark' ? '#12161d' : '#003262');
      if (toggle) {
        toggle.setAttribute('aria-pressed', theme === 'dark' ? 'true' : 'false');
        toggle.setAttribute('aria-label', theme === 'dark' ? 'Switch to light theme' : 'Switch to dark theme');
      }
    }
    apply(root.getAttribute('data-theme') || 'light');
    if (toggle) {
      toggle.addEventListener('click', function () {
        var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
        root.classList.add('theme-anim');
        apply(next);
        try { localStorage.setItem('theme', next); } catch (e) {}
        setTimeout(function () { root.classList.remove('theme-anim'); }, 350);
      });
    }
    if (window.matchMedia) {
      var mq = window.matchMedia('(prefers-color-scheme: dark)');
      var onChange = function (e) { if (!stored()) apply(e.matches ? 'dark' : 'light'); };
      if (mq.addEventListener) mq.addEventListener('change', onChange); else if (mq.addListener) mq.addListener(onChange);
    }

    /* Small screens: the header slides away while reading down and comes back
       as soon as the reader scrolls up (CSS limits the effect to phones). */
    var hdr = document.querySelector('.site-header'), lastY = window.scrollY;
    if (hdr) window.addEventListener('scroll', function () {
      var y = window.scrollY;
      if (Math.abs(y - lastY) < 6) return;
      hdr.classList.toggle('is-hidden', y > lastY && y > 160);
      lastY = y;
    }, { passive: true });

    /* Dated items (news, talks): mark those still to come, at viewing time. */
    var today = new Date(); today.setHours(0, 0, 0, 0);
    document.querySelectorAll('[data-date]').forEach(function (el) {
      var p = (el.getAttribute('data-date') || '').split('-');
      var start = new Date(+p[0], (+p[1] || 1) - 1, +p[2] || 1);   /* local date, no time-zone shift */
      if (!isNaN(start) && start > today) el.classList.add('is-upcoming');
    });

    /* Paper buttons (Abstract, Cite): open and close their panel; a link to
       a panel id (e.g. research.html#wired-for-growth-abstract) opens it. */
    document.querySelectorAll('[data-panel]').forEach(function (btn) {
      var panel = document.getElementById(btn.getAttribute('aria-controls'));
      if (!panel) return;
      btn.addEventListener('click', function () {
        var open = btn.getAttribute('aria-expanded') !== 'true';
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        panel.classList.toggle('is-open', open);
      });
    });
    function openFromHash() {
      var id = decodeURIComponent(location.hash.slice(1));
      if (!id) return;
      var b = document.querySelector('[data-panel][aria-controls="' + id + '"]');
      if (b && b.getAttribute('aria-expanded') !== 'true') b.click();
    }
    openFromHash();
    window.addEventListener('hashchange', openFromHash);

    /* Topic filter on the Research page (shown once there are many papers). */
    var topics = document.querySelectorAll('.topic-filter .topic');
    topics.forEach(function (btn) {
      btn.addEventListener('click', function () {
        var want = btn.getAttribute('data-topic');
        topics.forEach(function (b) {
          var on = b === btn;
          b.classList.toggle('is-active', on);
          b.setAttribute('aria-pressed', on ? 'true' : 'false');
        });
        document.querySelectorAll('.paper[data-topics]').forEach(function (a) {
          var tags = (a.getAttribute('data-topics') || '').split(' ');
          a.hidden = want !== 'all' && tags.indexOf(want) < 0;
        });
        document.querySelectorAll('.paper-section').forEach(function (s) {
          s.hidden = !s.querySelector('.paper:not([hidden])');
        });
      });
    });

    /* Copy-to-clipboard buttons (citations). */
    document.querySelectorAll('[data-copy]').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var el = document.getElementById(btn.getAttribute('data-copy'));
        if (!el || !navigator.clipboard) return;
        navigator.clipboard.writeText(el.innerText.trim()).then(function () {
          var label = btn.textContent;
          btn.textContent = 'Copied';
          btn.classList.add('copied');
          setTimeout(function () { btn.textContent = label; btn.classList.remove('copied'); }, 1800);
        });
      });
    });

    /* Gentle reveal of cards on scroll. */
    if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
    if (!('IntersectionObserver' in window)) return;
    var els = document.querySelectorAll('.paper, .course, .course-card, .session-card, .mat-group');
    els.forEach(function (el) { el.classList.add('will-reveal'); });
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) { e.target.classList.add('revealed'); io.unobserve(e.target); }
      });
    }, { threshold: 0.08 });
    els.forEach(function (el) { io.observe(el); });
  })();
</script>
</body>
</html>
